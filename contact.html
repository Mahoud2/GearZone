<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | GearZone</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="GearZone logo" />
      </a>

      <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="contact">
        <h1>Neem contact op</h1>

        <p>
          Heb je een vraag over onze gamingproducten? Vul het formulier in en
          neem contact op met GearZone!
        </p>

        <form class="contact-form" action="#" method="post">
          <div class="form-group">
            <label for="name">Naam</label>
            <input type="text" id="name" name="name" required />
          </div>

          <div class="form-group">
            <label for="email">E-mailadres</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="subject">Onderwerp</label>
            <input type="text" id="subject" name="subject" required />
          </div>

          <div class="form-group">
            <label for="message">Bericht</label>
            <textarea id="message" name="message" rows="6" required></textarea>
          </div>

          <button type="submit" class="button">Verstuur bericht</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 GearZone. Upgrade your setup.</p>
    </footer>
  </body>
</html>
